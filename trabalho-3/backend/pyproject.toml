[project]
name = "receitas-backend"
version = "0.1.0"
description = "Backend FastAPI do Assistente Inteligente de Receitas"
requires-python = ">=3.11"
dependencies = [
    # Cliente MCP (app/integrations/mcp_client.py). Mesma versão do servidor em mcp-server/.
    "mcp==2.3.0",
    "anyio>=4.5,<5",
    "jsonschema>=4.20",
    # LLM (app/integrations/ollama_client.py) e contratos (app/schemas)
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    # Camada HTTP (prompt 27): app/main.py e app/api/routes.py. Testado com fastapi 0.163.1 / uvicorn 0.54.0.
    "fastapi>=0.163,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_llm: integração com Ollama real (pulado se indisponível)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
