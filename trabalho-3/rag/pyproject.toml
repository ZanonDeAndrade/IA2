[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-receitas-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb==1.3.7",
    "huggingface-hub==0.36.2",
    "sentence-transformers==5.1.2",
    "transformers==4.57.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["rag"]
package-dir = {rag = "."}
