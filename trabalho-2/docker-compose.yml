# Lance a Lance – sobe o servidor MCP e o backend com um comando:
#   cp .env.example .env        # preencha as variáveis
#   docker compose up --build
#
# Base de puzzles (uma vez, ~300 MB de download):
#   docker compose run --rm puzzles

services:
  # Servidor de ferramentas MCP (Stockfish, python-chess, Chess.com, puzzles, RAG)
  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "8001"
    volumes:
      - ./data:/app/data                    # recorte da base de puzzles e cache do Chess.com
      - ./logs:/app/logs                    # log das chamadas de ferramentas
    ports:
      - "8001:8001"
    restart: unless-stopped

  # API FastAPI + agente LangGraph
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      MCP_URL: http://mcp_server:8001/mcp
    volumes:
      - ./data:/app/data                    # cache de análises e explicações (SQLite)
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - mcp_server
    restart: unless-stopped

  # Interface React + Vite (Milton): descomentar quando frontend/Dockerfile existir.
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   environment:
  #     - VITE_API_URL=http://localhost:8000

  # Baixa a base de puzzles da Lichess e salva o recorte em data/puzzles.sqlite.
  puzzles:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    profiles: ["dados"]
    command: ["python", "data/scripts/download_puzzles.py"]
    volumes:
      - ./data:/app/data
