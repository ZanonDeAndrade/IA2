x-analise: &analise
  SQLITE_PATH: /var/lib/lance/lance.sqlite
  ANALISE_PROFUNDIDADE: ${ANALISE_PROFUNDIDADE:-12}
  ANALISE_REVISAO_MOTOR: ${ANALISE_REVISAO_MOTOR:-1}

services:
  frontend:
    build:
      context: ./frontend
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

  mcp_server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
      additional_contexts:
        lance_base: service:backend
    init: true
    environment:
      <<: *analise
      STOCKFISH_PATH: /usr/games/stockfish
      CHROMA_PATH: /var/lib/chroma
      HF_HOME: /var/lib/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      CHESSCOM_USER_AGENT: ${CHESSCOM_USER_AGENT:-}
      PUZZLES_DB: /var/lib/lance/puzzles.sqlite
    volumes:
      - dados:/var/lib/lance
      - chroma:/var/lib/chroma
      - modelos:/var/lib/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 180s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      <<: *analise
      MCP_URL: http://mcp_server:8001/mcp
      MCP_HEALTH_URL: http://mcp_server:8001/healthz
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TEMPERATURA: ${LLM_TEMPERATURA:-0}
      LLM_RACIOCINIO: ${LLM_RACIOCINIO:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-25}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-0}
      LLM_REVISAO: ${LLM_REVISAO:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - dados:/var/lib/lance
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mcp_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  dados:
  chroma:
  modelos:
