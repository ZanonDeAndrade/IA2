# Limites da classificação dos lances (documentação, seção 8).
# A queda é medida em pontos de chance de vitória (0 a 100) do jogador:
#   queda = chance antes do lance - chance depois do lance

# Constante da curva logística (a mesma usada pela Lichess).
k = 0.00368208

[limites]
erro_grave = 30   # queda >= 30
erro = 20         # 20 <= queda < 30
imprecisao = 10   # 10 <= queda < 20
                  # queda < 10 -> aceitável
